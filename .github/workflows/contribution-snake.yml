name: Contribution snake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b94f87&color_dots=#f7eef5,#e6c6df,#cd93c0,#a962a5,#783f85
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f4a7c5&color_dots=#262238,#5e3a62,#875084,#b66aa4,#ed9ac6

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
